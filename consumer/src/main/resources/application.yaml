server:
  port: 8025
spring:
  application:
    name: consumer
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      ack-mode: RECORD # ack after each record succeeds. Default:BATCH
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: learning-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.electronik54.consumer.dto
        spring.json.value.default.type: com.electronik54.consumer.dto.OrderEvent
        spring.json.use.type.headers: false
logging:
  level:
    org.springframework.kafka.listener.DeadLetterPublishingRecoverer: DEBUG
    org.springframework.kafka.retrytopic: DEBUG
    org.apache.kafka: WARN
    org.springframework.kafka.listener.KafkaMessageListenerContainer: WARN